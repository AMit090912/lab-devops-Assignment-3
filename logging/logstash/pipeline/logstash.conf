# Logstash pipeline - Lab 3
# Filebeat (5044) -> parse JSON app logs -> enrich -> Elasticsearch

input {
  beats {
    port => 5044
  }
}

filter {
  # The app writes one JSON object per line; parse it into the [app] namespace
  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
  }

  # Use the application's own timestamp as the event time
  if [app][@timestamp] {
    date {
      match  => ["[app][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
    mutate { remove_field => ["[app][@timestamp]"] }
  }

  if [app][level] {
    mutate { add_field => { "log_level" => "%{[app][level]}" } }
  }

  # Tag interesting events so they are easy to filter in Kibana
  if [app][status] {
    if [app][status] >= 500 {
      mutate { add_tag => ["server_error"] }
    } else if [app][status] >= 400 {
      mutate { add_tag => ["client_error"] }
    }
  }
  if [app][event] == "prometheus_alert" {
    mutate { add_tag => ["alert"] }
  }
  if [app][event] == "auth_failure" {
    mutate { add_tag => ["security"] }
  }
  if [app][duration_ms] and [app][duration_ms] > 1000 {
    mutate { add_tag => ["slow_request"] }
  }

  mutate {
    add_field => { "pipeline" => "lab3-logstash" }
    remove_field => ["agent", "ecs", "input"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "lab3-app-logs-%{+YYYY.MM.dd}"
  }
  # Uncomment for debugging:
  # stdout { codec => rubydebug }
}
