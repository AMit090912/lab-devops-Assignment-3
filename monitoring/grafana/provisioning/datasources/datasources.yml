apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false

  - name: Elasticsearch (app logs)
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://localhost:9200
    editable: false
    jsonData:
      index: "lab3-app-logs-*"
      timeField: "@timestamp"
      logMessageField: app.message
      logLevelField: log_level
