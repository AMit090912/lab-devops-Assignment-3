# Prometheus configuration - Lab 3 (Amit, 2301010471)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: lab3-app
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:5000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["localhost:9100"]
